name: expense_tracker
description: "A Flutter Application to track expenses"

publish_to: "none"

version: 2.1.0+5

environment:
  sdk: ^3.8.1

dependencies:
  cupertino_icons: ^1.0.6
  fl_chart: ^0.65.0
  flutter:
    sdk: flutter
  flutter_sms_inbox: ^1.0.5
  google_fonts: ^6.2.1
  http: ^1.2.0
  intl: ^0.19.0
  path: ^1.8.3
  permission_handler: 11.3.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icons/


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#071638"
